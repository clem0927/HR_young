spring.application.name=HR

spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true
spring.messages.basename=messages
spring.messages.encoding=UTF-8
#vm???? ????.???? ?? -D
#spring.profiles.active=dev
spring.profiles.active=oracle, dev
#SQL ?? ????.
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

server.servlet.session.timeout=24h

# ==================== OpenAI API Settings ====================
# true: OpenAI API 사용, false: Rule-based 사용
ai.openai.enabled=false
# OpenAI API Key (enabled=true일 때 필수)
ai.openai.api-key=API_KEY
# 사용할 모델 (gpt-4o-mini 권장 - 저렴하고 빠름)
ai.openai.model=gpt-4o-mini
# Oracle DB ?? (?? IP)
